services:
  mysqldb:
    container_name: mysql-db
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: docker
      MYSQL_DATABASE: productdb
      # MYSQL_USER: klu
      # MYSQL_PASSWORD: klu
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql   # volume added here
    networks:
      - springboot-mysql-net
    

  backend:
    image: 2300030813-exam-backend:final
    container_name: springboot
    build:
      context: ./backend-springbootapp
      dockerfile: ../backend-springbootapp/backend.Dockerfile
    ports:
      - "2025:2000"
    depends_on:
      - mysqldb
    restart: on-failure
    networks:
      - springboot-mysql-net

  frontend:
    image: 2300030813-exam-frontend:final
    container_name: react
    build:
      context: ./frontend-reactapp
      dockerfile: ../frontend-reactapp/frontend.Dockerfile
    ports:
      - "2001:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - springboot-mysql-net

    
# Declare volumes at the bottom
volumes:
  mysql-data:
networks:
  springboot-mysql-net:

